# Nome que aparecerá no painel de "Actions" do repositório no GitHub
name: Continuous Integration - Develop

# Triggers - Define exatamente quando este pipeline automático deve disparar
on:
  push:
    branches: [ "develop", "feature/**" ]        # Dispara o pipeline em pushes na branch develop e em branches de feature
  pull_request:
    branches: [ "develop" ]        # Quando um PR for aberto ou atualizado para a branch develop, dispara o pipeline

# Jobs - Um job representa um ambiente isolado (virtual machine) para executar os passos.
jobs: 
  build-and-validate:
    name: Validar Compilação da Solução (.NET 8 & 10)

    # windows-latest para dar suporte à compilação do WinForms e workloads do Mobile (.NET MAUI)
    runs-on: windows-latest

    # steps - lista sequencial de passos do início ao fim
    steps: 
      # Clona o código fonte para a VM do GitHub
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Baixa e instala os SDKs do .NET exigidos pelos projetos da solução
      - name: Configurar SDKs do .NET (8.0 & 10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          include-prerelease: true        # Habilita suporte para versões pré-lançamento/preview (.NET 10)

      # Instala workload do .NET MAUI para compilar o projeto Pizzaria.Mobile
      - name: Instalar Workload do .NET MAUI
        run: dotnet workload install maui --ignore-failed-sources

      # Baixa todas as dependências de todos os projetos
      - name: Restaurar Pacotes NuGet da Solução
        run: dotnet restore Pizzaria.slnx

      # Compila todos os projetos em modo Release.
      # Se houver qualquer erro de sintaxe ou referência quebrada, o build falha aqui
      - name: Compilar Solução (Configuration Release)
        run: dotnet build Pizzaria.slnx --configuration Release --no-restore